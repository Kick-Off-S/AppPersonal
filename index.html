<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Gestión Personal</title>
  <meta name="description" content="Dieta, calorías, gastos y ahorro en tu teléfono">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Gestión">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-v2.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
  <script>
    // Aplica la paleta guardada antes de dibujar (evita ver un instante el color por defecto).
    try {
      const t = JSON.parse(localStorage.getItem('gp-theme') || 'null');
      if (t) (document.documentElement.dataset.palette = t.p), (document.documentElement.dataset.mode = t.m);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Dieta</h1>
    <div id="topbar-extra"></div>
  </header>
  <div id="notice"></div>
  <main id="view" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
